<!doctype html>
<html>
  <head>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css')}}"
    />
  </head>

  <body id="knockouts-page">
    <header class="navbar">
      <img src="{{ url_for('static', filename='images/logo.png')}}"" />

      <div class="nav-links">
        <a href="/" class="nav-results">Results</a>
        <a href="knockouts" class="nav-knockouts">Knockouts</a>
      </div>

      <button class="admin-btn">
        <img src="{{ url_for('static', filename='images/Vector.png')}}"" />
        Admin
      </button>
    </header>

    <main>
        <div class="login-page-container">
            <h1>Welcome Back!</h1>
            <p>Enter your details to authenticate</p>

        <div class="login-fields">
            <label for="user-email">Email</label>
            <input type="email" id="user-email" name="email" required>
            <label for="user-password">Password</label>
            <input type="password" id="use-password" name="password" required>



            <button class="login-btn">Login</button>
        </div>
        </div>

    </main>

    </body>

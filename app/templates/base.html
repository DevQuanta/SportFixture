<!doctype html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="{{ url_for('static', filename='dist/output.css') }}">
        <script src="https://unpkg.com/htmx.org@1.9.12"></script>
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='css/style.css')}}"
        />

        {% block head %}{% endblock %}
    </head>

    <body id="{% block body_id %}default-page{% endblock %}">
        <header class="navbar">
            <img src="{{ url_for('static', filename='images/logo.png')}}" />

            <div class="nav-links">
                <a href="/" class="nav-results">Results</a>
                <a href="knockouts" class="nav-knockouts">Knockouts</a>
            </div>

            {% if current_user.is_authenticated %}
            <a href="{{ url_for('auth.logout') }}" class="auth-btn logout-btn">
                <img
                    src="{{ url_for('static', filename='images/Vector.png')}}"
                />
                Logout
            </a>
            {% else %}
            <a href="{{ url_for('auth.login') }}" class="auth-btn admin-btn">
                <img
                    src="{{ url_for('static', filename='images/Vector.png')}}"
                />
                Admin
            </a>
            {% endif %}
        </header>

        <main>{% block content %} {% endblock %}</main>
    </body>
</html>

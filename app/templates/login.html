<!doctype html>
<html>
  <head>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css')}}"
    />
  </head>

  <body id="login-page">
    <header class="navbar">
      <img src="{{ url_for('static', filename='images/logo.png')}}" />

      <div class="nav-links">
        <a href="/" class="nav-results">Results</a>
        <a href="knockouts" class="nav-knockouts">Knockouts</a>
      </div>

      <button class="admin-btn">
        <img src="{{ url_for('static', filename='images/Vector.png')}}" />
        Admin
      </button>
    </header>

    <main>

        <div class="login-card">

            <div class="login-header">
                <h1>Welcome Back!</h1>
                <p>Enter your details to authenticate</p>
            </div>
            <form hx-post="/login" hx-target="#error-container" class="login-form">
                <div class="email-container">
                    <label for="user-email">Email</label>
                    <input type="email" id="user-email" name="email" required>
                </div>

                <div class="password-container">
                <label for="user-password">Password</label>
                <input type="password" id="user-password" name="password" required>
                </div>

                <button class="login-btn">Login</button>
            </form>

        </div>

    </main>

    </body>
    </html>

{% extends "base.html" %}

{% block body_id %}login-page{% endblock %}

{% block content %}

            <div class="mb-12">
                <h1 class="text-[30px] font-medium">Welcome Back!</h1>
                <p>Enter your details to authenticate</p>
            </div>
            <form hx-post="/login" hx-target="#error-container" class="flex flex-col gap-4" method="post">
                <div class="text-[18px] font-thin flex flex-col gap-0.75">
                    <label for="user-email">Email</label>
                    <input class="inp" type="email" id="user-email" name="email" required>
                </div>

                <div class="text-[18px] font-thin flex flex-col gap-0.75">
                <label for="user-password">Password</label>
                <input class="inp" type="password" id="user-password" name="password" required>
                </div>

                <button class="bg-[#ff383c] py-2 px-12.5 hover:cursor-pointer border border-transparent rounded-md">Login</button>
            </form>

            <div id="error-container" class="text-white"></div>


{% endblock %}

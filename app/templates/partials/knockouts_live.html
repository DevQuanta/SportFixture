<div id="live-stage-container">
    <div
        class="flex flex-row w-full h-full gap-10 justify-between items-center mt-5 mb-5"
    >
        <div class="flex flex-row">
        <!-- Round Tabs Navigation -->
        <div class="flex flex-row bg-slate-800 p-1 rounded-md text-xs"">
            {% for r_num in all_rounds %}
            <button
                hx-get="/tournament/{{ tournament_id }}/round/{{ r_num }}"
                hx-target="#live-stage-container"
                hx-swap="outerHTML"
                class="w-fit px-3 py-2 rounded-md transition-colors hover:cursor-pointer {% if r_num == current_round %}bg-[#FF2D55] text-white font-bold{% else %}bg-slate-800 text-gray-300 hover:bg-slate-700{% endif %}"
            >
                Round {{ r_num }}
            </button>

            {% endfor %}
        </div>


        </div>

        <div class="relative" x-data="{open: false}">
            <div>
             <button class="px-3 py-1.5 rounded-md bg-[#242A32] hover:cursor-pointer flex flex-row items-center hover:text-white focus:outline-none focus:ring-2 focus:ring-slate-500/50 transition-colors hover:bg-slate-700/80 duration-150 gap-1.5"
                 @click="open = true"
                 @keydown.escape="open = false">
                     <span>More</span>
                     <svg
                           class="h-4 w-4 text-slate-400 transition-transform duration-200 ease-out"
                           :class="open ? 'rotate-0' : '-rotate-90'"
                           xmlns="http://www.w3.org/2000/svg"
                           fill="none"
                           viewBox="0 0 24 24"
                           stroke-width="2"
                           stroke="currentColor"
                         >
                           <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
                         </svg>
             </button>

            </div>


             <div x-show="open" x-transition:enter="transition ease-out duration-100"
                 x-cloak
                 x-transition:enter-start="opacity-0 scale-95"
                 x-transition:enter-end="opacity-100 scale-100"
                 x-transition:leave="transition ease-in duration-75"
                 x-transition:leave-start="opacity-100 scale-100"
                 x-transition:leave-end="opacity-0 scale-95"
                 @click.outside="open = false" class="absolute z-10 right-0 top-full w-60 bg-[#161F30] border border-[#2A384C] rounded-md py-5 px-3">

                <div class="flex flex-col gap-4 items-baseline">
                 {% if current_round == max_round %}
                 <button
                     hx-post="/tournament/{{ tournament_id }}/round/advance"
                     hx-target="#live-stage-container"
                     hx-swap="outerHTML"
                     class="font-medium hover:cursor-pointer bg-transparent hover:underline"
                 >
                     Proceed to Round {{ current_round + 1 }}
                 </button>
                 <button
                     hx-post="/tournament/{{ tournament_id }}/round/advance?placement=True"
                     hx-target="#live-stage-container"
                     hx-swap="outerHTML"
                     class="font-medium hover:cursor-pointer bg-transparent"
                 >
                     Create placement round

                 </button>
                 <button
                     @click="$dispatch('open-confirm-modal', {
                         title: 'Are you sure you want to end tournament?',
                         method: 'POST',
                         actionUrl: '/tournament/{{ tournament_id }}/end }}',
                         targetId: '#live-stage-container',
                         swap: 'innerHTML'
                     })"
                   class=" text-[#F87171] hover:text-white rounded-md font-medium transition-colors hover:cursor-pointer duration-150"
                 >
                   End tournament
                   </button>
                 {% endif %}
                </div>
                 </div>
             </div>
        </div>


    {% include "partials/leaderboard.html"%}

    <div id="match-groups" class="flex md:flex-row flex-col gap-20">
        {% for group in active_round.groups %}
        <div class="flex flex-col gap-4 mt-5">
            <div class="font-medium text-[#E7E7E7] text-[20px]">
                Group {{group.id}}
            </div>

            {% for match in group.matches %} {% include
            "partials/match_card.html"%} {% endfor %}
        </div>
        {% endfor %}
    </div>
</div>

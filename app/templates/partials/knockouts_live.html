<div id="live-stage-container">
    <div class="flex flex-row w-full gap-10 items-center mt-5 mb-5">
        <div class="bg-[#FF2D55] px-3 py-2 rounded-md hover:cursor-pointer">
            Round {{tournament_data.number}}
        </div>

        <button
            hx-post="/tournament/{{tournament_id}}/round/advance"
            hx-target="#live-stage-container"
            hx-swap="outerHTML"
            class="text-cyan-400 font-medium hover:cursor-pointer bg-transparent"
        >
            Proceed to Round {{tournament_data.number + 1}} →
        </button>
    </div>

    {% include "partials/leaderboard.html" %}

    <div id="match-groups" class="flex flex-row gap-20">
        {% for group in tournament_data.groups %}
        <div class="flex flex-col gap-4 mt-5">
            <div class="font-medium text-[#E7E7E7] text-[20px]">
                Group {{group.id}}
            </div>

            {% for match in group.matches %} {% include
            "partials/match_card.html"%} {% endfor %}
        </div>
        {% endfor %}
    </div>
</div>

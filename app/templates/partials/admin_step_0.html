<div id="step-editor-container">
       {% include "partials/admin_navbar.html" %}

    <div class="flex flex-row justify-center">
        <div class="w-100 md:border md:border-white/20 md:px-15 md:py-10 rounded-md md:bg-[#121A2E]">
            <form
                hx-post="/tournament/{{ tournament.id }}/setup"
                hx-swap="outerHTML"
                hx-target="#step-editor-container"
                method="post"
            >
                <div class="flex flex-col gap-4">
                <input
                    type="hidden"
                    name="tournament_id"
                    value="{{tournament.id}}"
                />
                <div class="font-semibold text-[30px]">Settings</div>

                <div class="flex flex-col">
                        <label for="tournament-name">Name</label>
                        <input
                            type="text"
                            id="tournament-name"
                            name="tournament-name"
                            class="inp"
                            autocomplete="off"
                            placeholder="{{ tournament.name }}"
                        />

                </div>

                <div class="flex flex-col">
                        <label for="round-number">Number of rounds</label>
                        <input
                            type="number"
                            id="round-number"
                            name="round-number"
                            class="inp"
                            autocomplete="off"
                            placeholder="{{ tournament.max_rounds }}"
                        />
                </div>

                <div class="flex flex-col">
                        <label for="group-number">Number of groups</label>
                        <input
                            type="number"
                            id="group-number"
                            name="group-number"
                            class="inp"
                            autocomplete="off"
                            placeholder="{{ tournament.max_groups }}"
                        />

                </div>

                <div class="flex flex-row gap-4 justify-center">
                    <button
                        type="submit"
                        class="rounded-md bg-[#ff383c] text-[18px] text-white px-9 py-2 cursor-pointer w-fit"
                    >
                        Continue
                    </button>
                </div>

                </div>
            </form>
        </div>


    </div>

{% if players %}
<div class="bg-[#0e131f] border border-slate-700 rounded-md py-1 mt-1">
  {% for player in players %}
    <div
      class="px-3 py-2 hover:bg-slate-800 cursor-pointer flex justify-between items-center"
      hx-get="/players?id={{ player.id }}"
      hx-target="#player-diff-container"
      hx-swap="innerHTML"
      @click="open = false, query = '{{ player.name }}', diff = true"
    >
      <span>{{ player.name }}</span>
      <span class="w-3 h-3 rounded-full" style="background-color: {{ player.colour }};"></span>
    </div>
  {% endfor %}
  {% endif %}

    <div
      class="px-3 py-2 hover:bg-slate-800 cursor-pointer text-[#ff383c]"
      hx-get="/players?new-player={{ query }}"
      hx-target="#player-diff-container"
      @click="open = false"
      x-show="query.length > 0"
      x-cloak
    >
      + New Player "<span x-text="query"></span>"
    </div>
</div>

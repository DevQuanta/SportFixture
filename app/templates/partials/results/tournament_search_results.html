<div class="bg-[#0e131f] border border-slate-700 rounded-md rounded-t-none py-1 mt-1">
  {% for tournament in matching_tournaments %}
    <div
      class="px-3 py-2 hover:bg-slate-800 cursor-pointer flex justify-between items-center"
      hx-get="/admin?id={{ tournament.id }}"
      hx-swap="innerHTML"
      hx-push-url="true"
      hx-target="#tournament-editor"
      @click="open = false, query = '{{ tournament.name }}'"
    >
      <span>{{ tournament.name }}</span>
    </div>
  {% endfor %}

    <div
      class="px-3 py-2 hover:bg-slate-800 cursor-pointer text-[#ff383c]"
      hx-post="/admin"
      hx-target="#tournament-editor"
      hx-include="#search-tournaments input[name='query']"
      hx-swap="innerHTML"
      hx-on::after-request="open = false"
      x-show="query.length > 0"
      x-cloak
    >
      + New tournament "<span x-text="query"></span>"
    </div>
</div>

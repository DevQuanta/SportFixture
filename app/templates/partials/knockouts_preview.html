<div>

    <div class="flex flex-row w-full gap-12">
        {% for group_num, group_matches in matches_data | groupby('group_id') %}
        <div class="flex flex-col gap-3.5 bg-[#101622] py-3 px-5 w-[290px]">
            <div class="flex flex-row items-center justify-between">
                <div
                    class="font-medium text-[#E7E7E7] border-l-2 border-l-amber-400 px-3"
                >
                    Group {{ group_num }}
                </div>
                <div class="text-white/75 text-[12px] font-light">
                    4 players
                </div>
            </div>
            {% for match in group_matches %}

            <div class="flex flex-col gap-y-1 px-5 py-1 w-full bg-[#172030] h-20 justify-center">
                <div class="flex flex-row justify-between w-full items-center">
                    <div class="text-white/90 text-[15px]">{{ players_map[match.player_1_id] }}</div>
                    <div class="text-white/75 text-[12px] font-light">
                        Seed #1
                    </div>
                </div>
                <div class="h-px w-full bg-white/30 block"></div>
                <div class="flex flex-row justify-between w-full items-center">
                    <div class="text-white/90 text-[15px]">{{ players_map[match.player_2_id] }}</div>
                    <div class="text-white/75 text-[12px] font-light">
                        Seed #2
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
        {% endfor %}

    </div>
</div>

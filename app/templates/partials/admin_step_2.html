<script>
document.querySelectorAll('.tom-select-headless').forEach(select => {
    new TomSelect(select, {
        plugins: ['dropdown_input'], // Optional: adds a search bar inside the dropdown list itself
        controlInput: null,          // Hides the input bar on the main card row
        hideSelected: true,
        // This hides the actual visible TomSelect input box completely,
        // leaving your clean player card untouched while keeping the dropdown engine active
        onInitialize: function() {
            this.control.style.display = 'none';
        }
    });
});
</script>

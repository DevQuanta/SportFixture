<div id="step-group-container">
    <div class="flex flex-col gap-4 mb-10">
    <div class="flex flex-row mt-12.5 justify-between">
            <div class="flex flex-row gap-3 items-center">
                <div
                    class="flex flex-col rounded-full items-center justify-center text-center w-6 h-6 bg-green-500 text-[16px] opacity-90"
                >
                    1
                </div>
                <div class="text-[18px] text-green-500">Register Player</div>
            </div>
            <div class="flex flex-row gap-3 items-center">
                <div
                    class="flex flex-col rounded-full items-center justify-center text-center w-6 h-6 bg-[#ff2d55] text-[16px]"
                >
                    2
                </div>
                <div class="text-[18px]">Seed Draws</div>
            </div>
            <div class="flex flex-row gap-3 items-center opacity-60">
                <div
                    class="flex flex-col rounded-full items-center justify-center text-center w-6 h-6 bg-[#8d8d8d] text-[16px]"
                >
                    3
                </div>
                <div class="text[18px]">Preview & Publish</div>
            </div>
    </div>
    <div class="flex flex-row justify-between">

        <a class="rounded-md bg-transparent text-cyan-500 px-2 py-2 cursor-pointer"
            hx-post="/admin/{{tournament.id}}/previous/"
            hx-swap="outerHTML"
            hx-target="#step-group-container">← Previous Step</a>

        <a class=" text-cyan-500 px-2 py-2 cursor-pointer"
            hx-post="/admin/{{tournament.id}}/advance/"
            hx-swap="outerHTML"
            hx-target="#step-group-container">Next Step →</a>
    </div>

    </div>
    <div class="flex flex-row justify-between items-start gap-10 w-full">


    {% for n in grouped_players.keys()|sort %}

        <div class="flex flex-col w-20% pr-5 h-100 text-white/70 font-light">
            {% if n == 0 %}
            Unassigned
            {% else %}

            Group {{ n }}

            {% endif %}

            {% for player in grouped_players[n] %}
            <div
                class="flex flex-row items-center justify-between gap-4 mt-2.5 bg-[#121A2E] px-3 py-2 rounded-md"
            >

                <details class="group/player">
                    <summary class="flex flex-row items-center justify-between gap-4 list-none cursor-pointer focus:outline-none">
                <!-- Player Details -->
                <div class="flex flex-col gap-0.5">
                    <div class="text-white">{{player.name}}</div>
                    <div class="{{player.difficulty}}">{{player.difficulty}}</div>
                </div>

                <!-- The Chevron  -->
                <span
                    class="w-2.5 h-2.5 border-t-2 border-r-2 border-white transform rotate-45 shrink-0 transition-transform duration-200 group-open/player:rotate-135" onclick="document.getElementById('select-jason').tomselect.open()"
                ></span>

                    </summary>

                            <!--  opens inline inside the box -->
                            <div class="mt-3 pt-2 border-t border-white/5 animate-fade-in">
                                <select
                                    name="group_id"
                                    hx-post="/{{tournament.id}}/players/{{player.id}}/assign"
                                    hx-target="#step-group-container"
                                    class="bg-[#0b1120] text-sm text-white rounded border border-slate-700 px-2 py-1 w-full focus:outline-none"
                                >
                                    <option value="">Move to...</option>
                                    {% for opt in range(1, tournament.max_groups + 1) %}
                                    <option value="{{opt}}">Group {{opt}}</option>
                                    {% endfor %}
                                </select>
                            </div>

                        </details>
            </div>

            {% endfor %}
        </div>
        {%endfor%}
    </div>
</div>

<div id="step-editor-container">
    {% include "partials/admin_navbar.html" %}
    <div class="flex flex-col md:flex-row justify-between items-start gap-10 md:gap-10 w-full">


    {% for n in grouped_players.keys()|sort %}


        <div class="flex flex-col w-full pr-5 md:h-100 text-white/70 font-light">
            <div class="flex flex-row gap-6 items-center w-full">

            {% if n == 0 %}
            <div>
            Unassigned
            </div>
            {% else %}
            <div>

            Group {{ n }}
            </div>

            <button
            hx-post="/tournament/{{ tournament.id }}/group/{{ n }}/remove"
            hx-target="#step-editor-container"
            hx-swap="outerHTML"
            class="hover:cursor-pointer"
            ><img src="{{ url_for('static', filename='images/remove_grp.svg') }}" class="h-5 w-5">

            </img></button>

            {% endif %}

            </div>

            {% for player in grouped_players[n] %}
            <div
                class="flex flex-row items-center justify-between gap-4 mt-2.5 bg-[#121A2E] px-5 py-3 rounded-md w-fit"
            >

                <details class="group/player">
                    <summary class="flex flex-row items-center justify-between gap-4 list-none cursor-pointer focus:outline-none">
                <!-- Player Details -->
                <div class="flex flex-col gap-0.5 w-26">
                    <div class="text-white">{{player.name}}</div>
                    <div class="rank text-(--player-clr)"
                        style="--player-clr: {{ player.colour }};">{{player.difficulty}}</div>
                </div>

                <!-- The Chevron  -->
                <span
                    class="w-2.5 h-2.5 border-t-2 border-r-2 border-white transform rotate-45 shrink-0 transition-transform duration-200 group-open/player:rotate-135" onclick="document.getElementById('select-jason').tomselect.open()"
                ></span>

                    </summary>

                            <!--  opens inline inside the box -->
                            <div class="mt-3 pt-2 border-t border-white/5 animate-fade-in">
                                <select
                                    name="group_id"
                                    hx-post="/{{tournament.id}}/players/{{player.id}}/assign"
                                    hx-target="#step-editor-container"
                                    class="bg-[#0b1120] text-sm text-white rounded border border-slate-700 px-2 py-1 w-full focus:outline-none"
                                >
                                    <option value="">Move to...</option>
                                    {% for opt in range(1, tournament.max_groups + 1) %}
                                    <option value="{{opt}}">Group {{opt}}</option>
                                    {% endfor %}
                                </select>
                            </div>

                        </details>
            </div>

            {% endfor %}
        </div>
        {%endfor%}
    </div>
</div>

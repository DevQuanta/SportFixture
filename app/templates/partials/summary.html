<div id="live-stage-container">

    <h1 class="mb-5 text-white text-3xl">Winners</h1>
    <div class="mb-10 flex flex-col md:flex-row md:gap-24 gap-5 w-full h-full px-3 py-5">
        {% for winner in winners %}
        <div class="flex flex-row h-35">
        <div class="w-3 h-full block rounded-l-md bg-[#6155F5]"></div>
        <div class="px-4 py-4 rounded-r-md bg-[#364468]/50 flex flex-col w-full md:w-44 gap-3">
            <div class="font-medium text-[#34C759] text-[20px]">#{{ loop.index }}</div>
            <div>
            <div class="font-medium text-[20px]">{{ winner.name }}</div>
            <div class="font-light">Win rate: <span>{{ winner.win_rate }} %</span></div>
            </div>
        </div>
        </div>
        {% endfor %}
    </div>


    <h1 class="mb-5 text-white text-3xl">Leaderboard</h1>

    <div id="tournament-leaderboard-container"
         class="flex flex-col md:flex-row h-full w-full">

        <div class="flex flex-col w-full rounded-md gap-3.5">

        <div id="leaderboard-filters" class="flex flex-col w-full rounded-md gap-3.5">
            <div class="flex flex-row gap-3 py-4 md:px-4 md:py-0 items-center">
                <input
                    class="px-1.5 py-1 bg-[#121620] border border-slate-500 flex-1 rounded-md text-white placeholder-white/40 text-[15px]" placeholder="Search for a player"
                    class="inp"
                    autocomplete="off"
                    hx-get="/leaderboard/filter?tournament_id={{tournament.id}}"
                    name="player_name"
                    hx-trigger="input changed delay:300ms"
                    hx-target="#leaderboard-container"
                    hx-swap="outerHTML"
                ></input>

        </div>


        </div>

        <div id="leaderboard-container">
            {% include "partials/leaderboard_table.html" %}
        </div>
        </div>

    </div>

</div>

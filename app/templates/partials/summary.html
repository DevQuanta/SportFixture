<div id="live-stage-container">

    <h1 class="mb-5 text-white text-3xl">Winners</h1>
    <div class="mb-10 flex flex-row gap-24 w-full h-full px-3 py-5">
        {% for winner in winners %}
        <div class="flex flex-row h-35">
        <div class="w-3 h-full block rounded-l-md bg-[#6155F5]"></div>
        <div class="px-4 py-4 rounded-r-md bg-[#364468]/50 flex flex-col w-44 gap-3">
            <div class="font-medium text-[#34C759] text-[20px]">#{{ loop.index }}</div>
            <div>
            <div class="font-medium text-[20px]">{{ winner.name }}</div>
            <div class="font-light">Win rate: <span>{{ winner.win_rate }} %</span></div>
            </div>
        </div>
        </div>
        {% endfor %}
    </div>


    <h1 class="mb-5 text-white text-3xl">Leaderboard</h1>

    {% include "partials/_leaderboard_main.html" %}

</div>


    <tr id="player-row-{{ player.id }}" class="border-b border-b-[#f8fafc80]">
        <td class="text-center py-3 w-fit">
                <input class="text-white border rounded-md border-slate-500 md:w-40 text-center mx-2 md:mx-auto" name="player-name" value="{{ player.name }}">
        </td>
        <td class="rank {{player.difficulty}} text-center py-3 w-fit">
                <input class="text-white border rounded-md border-slate-500  md:w-40 text-center mx-2 md:mx-auto" name="player-diff" value="{{ player.difficulty }}">
        </td>

        <td class="actions-col text-center py-3">
            <div class="flex flex-row justify-center gap-3">
                <button
                    hx-post="/save-player/{{ player.id }}?tournament_id={{ tournament.id }}"
                    hx-target="#player-row-{{ player.id }}"
                    hx-include="closest tr"
                    hx-swap="outerHTML"
                    class="hover:cursor-pointer"
                >
                    <img
                        src="{{ url_for('static', filename='images/done.svg') }}"
                        width="22.49"
                        height="22.49"
                    />
                </button>

            </div>
        </td>
    </tr>


    <tr id="player-row-{{ player.id }}">
        <td>
            <input class="inp" name="player-name" value="{{ player.name }}"></td>
        <td class="rank {{player.difficulty}}"><input class="inp" name="player-diff" value="{{ player.difficulty }}"></td>

        <td class="actions-col">
            <div class="flex flex-row justify-center gap-3">
                <button
                    hx-post="/save-player/{{ player.id }}"
                    hx-target="#player-row-{{ player.id }}"
                    hx-include="closest tr"
                    hx-swap="outerHTML"
                    class="edit-btn"
                >
                    <img
                        src="{{ url_for('static', filename='images/done.svg') }}"
                        width="22.49"
                        height="22.49"
                    />
                </button>

            </div>
        </td>
    </tr>

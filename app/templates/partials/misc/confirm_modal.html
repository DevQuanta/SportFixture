<div x-data="{ open: false, title: '', method: 'POST', actionUrl: '', targetId: '', swap: '' }"
     @open-confirm-modal.window="
        open = true;
        title = $event.detail.title;
        method = $event.detail.method || 'POST';
        actionUrl = $event.detail.actionUrl;
        targetId = $event.detail.targetId;
        swap = $event.detail.swap;
     "
     x-show="open"
     x-cloak
     class="relative z-50">

<div
    class="fixed right-0 top-0 w-full z-10 bg-black/60 h-full" @click="open = false"
></div>
<div class="fixed z-999 top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-[#121212] w-fit h-fit rounded-md border border-white/40 px-4 md:px-12 py-10">
    <div class="flex flex-col items-center h-full gap-8">
        <div class="text-[20px]" x-text="title"></div>
        <div class="flex flex-row gap-3 w-full">
            <button @click="open = false" class="rounded bg-slate-700 px-4 py-3 hover:cursor-pointer">Cancel</button>
            <button @click="
                                        htmx.ajax(method, actionUrl, { target: targetId, swap: swap });
                                        open = false;
                                    "

                                    class="rounded bg-red-600 px-4 py-3 hover:cursor-pointer">Confirm</button>
        </div>
    </div>
</div>

     </div>

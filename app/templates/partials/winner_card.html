
<div id="winner-widget"
 class="flex flex-col bg-[#121A2E] justify-center w-full md:w-80 rounded-md items-center gap-2 px-5 py-5 mr-10" hx-swap-oob="outerHTML"
>
    <div class="flex flex-row items-center gap-3 font-semibold text-[20px] w-full justify-center">
        <img class="h-fit w-fit" src="{{ url_for('static', filename='images/trophy.svg') }}">Winner of<br>the month</div>

    <div class="flex flex-col w-full items-center">
    <h2 class="text-4xl font-medium bg-linear-to-r from-[#34C759] to-[#00C3D0] bg-clip-text text-transparent">{{ past_tournaments[0].standings[0].name }}</h2>
    {% set matches_won=past_tournaments[0].standings[0].matches_won %}
    <span class="italic">Won {{ matches_won }} match{% if matches_won > 1 %}es{% endif %}</span>
    </div>
</div>

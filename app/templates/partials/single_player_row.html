<tr id="player-row-{{player.id}}" class="border-b border-b-[#f8fafc80]">
    <td class="text-center py-3">{{ player.name }}</td>
    <td class="rank text-(--player-clr) text-center py-3"
        style="--player-clr: {{ player.colour }};"
    >{{ player.difficulty }}</td>

    <td>
        <div class="flex flex-row justify-center gap-3">
            <button
                hx-get="/edit-player/{{ player.id }}?tournament_id={{ tournament.id }}"
                hx-target="#player-row-{{ player.id }}"
                hx-swap="outerHTML"
                class="hover:cursor-pointer"
            >
                <img
                    src="{{ url_for('static', filename='images/edit.svg') }}"
                    width="22.49"
                    height="22.49"
                />
            </button>
            <button
                @click="$dispatch('open-confirm-modal', {
                    title: 'Are you sure you want to remove {{ player.name }}?',
                    method: 'DELETE',
                    actionUrl: '/delete-player/{{ player.id }}?tournament_id={{ tournament.id }}',
                    targetId: '#player-row-{{ player.id }}',
                    swap: 'outerHTML'
                })"
                class="hover:cursor-pointer"
            >
                <img
                    src="{{ url_for('static', filename='images/remove.svg') }}"
                    width="15.8"
                    height="18"

                />
            </button>
        </div>
    </td>
</tr>

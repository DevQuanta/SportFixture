{% extends "base.html" %}

{% block body_id %}admin-page{% endblock %}

{% block content %}

<h1><span class="header-prefix">//</span> Knockout League</h1>

<div class="admin-steps">
    <div class="admin-step step-1">
        <div class="step-circle">1</div>
        <div class="step-name">Register Player</div>
    </div>
    <div class="admin-step step-2">
        <div class="step-circle">2</div>
        <div class="step-name">Seed Draws</div>
    </div>
    <div class="admin-step step-3">
        <div class="step-circle">3</div>
        <div class="step-name">Preview & Publish</div>
    </div>
</div>

<div class="admin-horizontal-container">
    <div class="admin-player-register-container">
        <form class="admin-player-register-form">
            <div class="player-name-container">
                <label for="player-name">Player name</label>
                <input
                    type="text"
                    id="player-name"
                    name="player-name"
                    required
                />
            </div>
            <div class="player-diff-container">
                <label for="player-diff">Player difficulty</label>
                <input
                    type="text"
                    id="player-diff"
                    name="player-diff"
                    required
                />
            </div>

            <button class="add-player-btn" href="#">Add Player</button>
        </form>
    </div>

    <table class="admin-tbl">
        <thead>
            <tr>
                <th>Name</th>
                <th>Difficulty</th>
                <th class="actions-col">Actions</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Aryan A.</td>
                <td class="rank beginner">Beginner</td>
                <td class="actions-col">
                    <div class="actions-group">
                        <button class="edit-btn">
                            <img
                                src="{{ url_for('static', filename='images/edit.svg') }}"
                                width="22.49"
                                height="22.49"
                            />
                        </button>
                        <button class="delete-btn">
                            <img
                                src="{{ url_for('static', filename='images/remove.svg') }}"
                                width="15.8"
                                height="18"
                            />
                        </button>
                    </div>
                </td>
            </tr>

            <tr>
                <td>Kimmy J.</td>
                <td class="rank intermediate">Intermediate</td>
                <td class="actions-col">
                    <div class="actions-group">
                        <button class="edit-btn">
                            <img
                                src="{{ url_for('static', filename='images/edit.svg') }}"
                                width="22.49"
                                height="22.49"
                            />
                        </button>
                        <button class="delete-btn">
                            <img
                                src="{{ url_for('static', filename='images/remove.svg') }}"
                                width="15.8"
                                height="18"
                            />
                        </button>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>
</div>

{% endblock %}
